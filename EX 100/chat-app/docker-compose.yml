version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    depends_on:
      - db
    restart: on-failure
    command: >
      sh -c "echo 'Waiting for DB port...'; until nc -z db 5432; do sleep 1; done; echo 'DB port open, waiting 10s for startup...'; sleep 10; npx prisma db push --schema=backend/prisma/schema.prisma && npm start"
    environment:
      - XAI_API_KEY=${XAI_API_KEY}
      
      - JWT_SECRET=${JWT_SECRET}
      - PEPPER_SECRET=${PEPPER_SECRET}
      # Connection string pour PostgreSQL

      - DATABASE_URL=postgresql://postgres:password@db:5432/chatapp

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=chatapp
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
